<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmetic Brand Logo - Pink Metallic Flower Emblem</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f0f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      color: #2b2b2e;
    }
    .container {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      padding: 40px;
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #1a1a1c;
    }
    p.caption {
      font-size: 14px;
      color: #71717a;
      margin-top: 16px;
    }
    .svg-wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #eaeaeC 100%);
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BLOSSOM COSMETICS</h1>
    <div class="svg-wrapper">
      <svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Floor Soft Shadow Filter -->
          <filter id="floorShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="18" />
            <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.05  0 0 0 0 0.2  0 0 0 0.35 0" />
            <feOffset dx="0" dy="32" />
            <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
          </filter>

          <!-- Ambient Glow Filter -->
          <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
          </filter>

          <!-- Metallic Pink Base Gradient -->
          <linearGradient id="pinkMetallicBase" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f472b6" />
            <stop offset="30%" stop-color="#db2777" />
            <stop offset="70%" stop-color="#9d174d" />
            <stop offset="100%" stop-color="#700736" />
          </linearGradient>

          <!-- 3D Surface Bevel Radial Gradient -->
          <radialGradient id="surfaceHighlight" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
            <stop offset="25%" stop-color="#fbcfe8" stop-opacity="0.5" />
            <stop offset="60%" stop-color="#be185d" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#500727" stop-opacity="0.6" />
          </radialGradient>

          <!-- Side Depth Gradient -->
          <linearGradient id="sideShadow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#be185d" />
            <stop offset="50%" stop-color="#831843" />
            <stop offset="100%" stop-color="#4c0525" />
          </linearGradient>

          <!-- Top Edge Specular Highlight Gradient -->
          <linearGradient id="specularRim" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="40%" stop-color="#f472b6" stop-opacity="0.4" />
            <stop offset="70%" stop-color="#ffffff" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#9d174d" stop-opacity="0.1" />
          </linearGradient>

          <!-- Reusable Petal Geometry -->
          <g id="singlePetal">
            <path d="M 0,0 C -35,-45 -45,-110 0,-150 C 45,-110 35,-45 0,0 Z" />
          </g>
        </defs>

        <!-- Background Studio Light -->
        <rect width="800" height="600" fill="url(#bgGradient)" />
        <radialGradient id="bgGradient" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#f1f1f4" />
          <stop offset="100%" stop-color="#e2e2e7" />
        </radialGradient>

        <!-- Ambient Pink Floor Reflection -->
        <ellipse cx="400" cy="340" rx="160" ry="100" fill="#db2777" opacity="0.15" filter="url(#pinkGlow)" />

        <!-- Main 3D Logo Symbol Container -->
        <g transform="translate(400, 240)">
          
          <!-- 1. Deep Floor Drop Shadow -->
          <g filter="url(#floorShadow)">
            <g transform="scale(1.05) translate(0, 15)">
              <path d="M0,-75 C-30,-75 -50,-50 -65,-25 C-80,-50 -105,-50 -115,-20 C-125,10 -100,35 -80,55 C-105,65 -110,95 -85,115 C-60,135 -35,115 -10,95 C0,120 25,130 45,115 C65,100 60,70 45,50 C70,45 85,25 75,-5 C65,-35 35,-35 20,-50 C25,-75 0,-75 0,-75 Z" opacity="0" />
              <!-- Abstract Flower Silhouette for Drop Shadow -->
              <circle cx="0" cy="0" r="110" fill="#000000" />
            </g>
          </g>

          <!-- 2. 3D Extruded Sides (Depth Layer) -->
          <g fill="url(#sideShadow)" transform="translate(0, 12)">
            <!-- Outer ring of petals extruded downward -->
            <path d="M 0,0 
                     M 0,-165 C -48,-120 -55,-50 0,0
                     M 142,-82 C 70,-100 25,-25 0,0
                     M 142,82 C 118,30 30,25 0,0
                     M 0,165 C -48,120 -55,50 0,0
                     M -142,82 C -118,30 -30,25 0,0
                     M -142,-82 C -70,-100 -25,-25 0,0" />
            <!-- Extrusion backdrop shapes for 6 rounded petals -->
            <circle cx="0" cy="0" r="136" fill="url(#sideShadow)" />
          </g>

          <!-- 3. Front Face - Metallic Base -->
          <g transform="translate(0, 0)">
            <!-- 6 Petals Rotated around Center -->
            <g fill="url(#pinkMetallicBase)">
              <!-- Petal 1 (Top) -->
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" />
              <!-- Petal 2 (Top Right) -->
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(60)" />
              <!-- Petal 3 (Bottom Right) -->
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(120)" />
              <!-- Petal 4 (Bottom) -->
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(180)" />
              <!-- Petal 5 (Bottom Left) -->
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(240)" />
              <!-- Petal 6 (Top Left) -->
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(300)" />
              <!-- Center Smooth Core -->
              <circle cx="0" cy="0" r="42" />
            </g>

            <!-- 4. Glossy Surface Highlights & Metallic Reflections Overlay -->
            <g fill="url(#surfaceHighlight)" mode="screen">
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" />
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(60)" />
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(120)" />
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(180)" />
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(240)" />
              <path d="M 0,-15 C -25,-25 -65,-90 0,-155 C 65,-90 25,-25 0,-15 Z" transform="rotate(300)" />
              <circle cx="0" cy="0" r="42" />
            </g>

            <!-- 5. Curved Specular Rim Light Edges -->
            <g fill="none" stroke="url(#specularRim)" stroke-width="4" stroke-linecap="round">
              <!-- Inner Rim Accents for 3D bevel sheen -->
              <path d="M -10,-140 C 20,-145 40,-110 15,-60" />
              <path d="M -10,-140 C 20,-145 40,-110 15,-60" transform="rotate(60)" />
              <path d="M -10,-140 C 20,-145 40,-110 15,-60" transform="rotate(120)" />
              <path d="M -10,-140 C 20,-145 40,-110 15,-60" transform="rotate(180)" />
              <path d="M -10,-140 C 20,-145 40,-110 15,-60" transform="rotate(240)" />
              <path d="M -10,-140 C 20,-145 40,-110 15,-60" transform="rotate(300)" />
              
              <!-- Core Specular Arc -->
              <circle cx="0" cy="0" r="38" stroke="url(#specularRim)" stroke-width="3" opacity="0.8" />
            </g>

            <!-- 6. Bright Glint Spot Highlights -->
            <ellipse cx="-20" cy="-80" rx="8" ry="22" fill="#ffffff" opacity="0.6" transform="rotate(-20 -20 -80)" />
            <ellipse cx="65" cy="-45" rx="5" ry="16" fill="#ffffff" opacity="0.5" transform="rotate(35 65 -45)" />
            <circle cx="-10" cy="-15" r="5" fill="#ffffff" opacity="0.8" />
          </g>
        </g>

        <!-- Brand Typography Presentation -->
        <g transform="translate(400, 460)" text-anchor="middle">
          <!-- Brand Name -->
          <text y="0" font-family="'Didot', 'Bodoni MT', 'Cinzel', 'Times New Roman', serif" font-size="36" font-weight="600" letter-spacing="10" fill="#1c1917">LUMIÈRE</text>
          <!-- Subtitle / Tagline -->
          <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="6" fill="#9d174d">PARIS • MAISON DE BEAUTÉ</text>
          <!-- Decorative Line -->
          <line x1="-40" y1="50" x2="40" y2="50" stroke="#db2777" stroke-width="1.5" opacity="0.6" />
        </g>
      </svg>
    </div>
    <p class="caption">3D Metallic Pink Flower Logo Design for Luxury Cosmetic Brand</p>
  </div>
</body>
</html>
